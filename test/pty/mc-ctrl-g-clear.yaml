name: mc-ctrl-g-clears-cursors
filename: mc-clear.txt
initial: |
  foo bar
  foo baz
  foo qux
keys:
  # mark all foos, then C-g drops the extra cursors; X goes only to the
  # primary cursor (start of the first foo).
  - C-c
  - m
  - a
  - C-g
  - X
expected_saved: |
  Xfoo bar
  foo baz
  foo qux
